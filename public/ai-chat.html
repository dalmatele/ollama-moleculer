<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>AI Chat</title>
  <style>
    body { font-family: Arial; background: #111; color: #eee; }
    #chat { height: 400px; overflow-y: auto; border: 1px solid #444; padding: 10px; }
    .msg { margin: 8px 0; }
    .user { color: #4fc3f7; }
    .bot { color: #aed581; }
    input, button { padding: 10px; margin-top: 10px; }
    input { width: 80%; }
  </style>
</head>
<body>

<h2>🤖 AI Chat - Hublock demo</h2>

<div id="chat"></div>

<input id="input" placeholder="Nhập câu hỏi..." />
<button onclick="send()">Gửi</button>
<input id="token" placeholder="Nhập token..."  type="password"/>

<script>
async function send() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const tokenInput = document.getElementById("token");
  const token = tokenInput.value.trim();
  if(!token){
    addMessage("AI", "Vui lòng nhập token trước khi tiếp tục");
  }

  const text = input.value.trim();
  if (!text) return;

  addMessage("Bạn", text, "user");
  input.value = "";

  const res = await fetch("https://ai.hublock.vn/api/private/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({
      prompt: text
    })
  });

  const data = await res.json();

  addMessage("AI", data.data || "Lỗi", "bot");
}

function addMessage(sender, text, cls) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = "<b>" + sender + ":</b> " + text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
